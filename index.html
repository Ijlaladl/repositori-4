<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech4 Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid grid-rows-[auto_1fr_auto] min-h-screen m-0 p-0 font-sans">

    <header id="main-header" class="grid grid-cols-1 items-center bg-slate-800 text-white p-4 h-20">
        </header>

    <div id="main-wrapper" class="grid grid-cols-5">

        <nav id="main-navigation" class="col-span-1 grid grid-cols-1 content-start bg-slate-100 p-4 border-r border-slate-300">
            </nav>

        <main id="main-content" class="col-span-3 grid grid-cols-1 content-start bg-white p-6">
            <article class="grid grid-cols-1 gap-4">
                </article>
        </main>

        <aside id="right-sidebar" 
    class="col-span-1 grid grid-cols-1 content-start bg-pink-50 p-4 border-l border-pink-300 space-y-6">

    <!-- Search -->
    <div>
        <h3 class="font-semibold mb-2">Cari Produk</h3>
        <input type="text" placeholder="Search..."
            class="w-full border border-pink-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-pink-400">
    </div>

    <!-- Kategori -->
    <div>
        <h3 class="font-semibold mb-2">Kategori</h3>
        <ul class="space-y-2 text-sm">
            <li class="hover:text-pink-600 cursor-pointer">Brush</li>
            <li class="hover:text-pink-600 cursor-pointer">Cermin</li>
            <li class="hover:text-pink-600 cursor-pointer">Makeup Organizer</li>
            <li class="hover:text-pink-600 cursor-pointer">Beauty Blender</li>
        </ul>
    </div>

    <!-- Testimoni -->
    <div>
        <h3 class="font-semibold mb-2">Testimoni</h3>
        <p class="text-sm italic">"Produknya bagus dan berkualitas!" ⭐⭐⭐⭐⭐</p>
    </div>

    <!-- Keranjang -->
    <div class="bg-white p-3 rounded-lg shadow">
        <h3 class="font-semibold mb-2">🛒 Keranjang</h3>
        
        <ul id="cart-list" class="text-sm space-y-1 max-h-32 overflow-auto"></ul>
        
        <p class="mt-3 font-bold text-pink-600">
            Total: Rp <span id="total-price">0</span>
        </p>

        <button onclick="resetCart()" 
            class="mt-2 w-full bg-pink-600 text-white py-1 rounded hover:bg-pink-700 transition">
            Reset Keranjang
        </button>
    </div>

        </aside>

    </div>

    <footer id="main-footer" class="grid grid-cols-1 items-center bg-slate-900 text-white p-4 text-center h-16">
        </footer>

</body>
</html>
